name = "fyl-alert-digest"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Cron: todos los días, ventana 9:00–10:55 Chile = 13:00–14:55 UTC (UTC-4), cada 5 min.
# Cada tick procesa el siguiente lote de usuarios no-procesados (sent-log) y para
# solo cuando la cohorte se vació; los ticks sobrantes son no-ops baratos.
[triggers]
crons = ["*/5 13-14 * * *"]

# Variables no sensibles
[vars]
SUPABASE_URL = "https://qumfnywynqgojmepuffx.supabase.co"
APP_URL      = "https://app.fondosylicitaciones.cl"

# Secretos — configurar con:
#   wrangler secret put SUPABASE_SERVICE_KEY
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put CRON_SECRET
